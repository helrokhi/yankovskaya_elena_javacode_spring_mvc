databaseChangeLog:
  - changeSet:
      id: 001
      author: Elena_Yankovskaya
      changes:
        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true