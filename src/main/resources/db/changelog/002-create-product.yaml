databaseChangeLog:
  - changeSet:
      id: 002
      author: Elena_Yankovskaya
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: price
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
                    checkCondition: price >= 0
              - column:
                  name: quantity_stock
                  type: INT
                  constraints:
                    nullable: false
                    checkCondition: quantity_stock >= 0
