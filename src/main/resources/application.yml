server:
  port: 9090

spring:
  datasource:
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.yaml

  h2:
    console:
      enabled: true
      path: /h2-console
